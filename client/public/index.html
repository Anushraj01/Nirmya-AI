<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive human body SVG map for medical usage with WebMD-style drill-down from major to minor anatomical regions." />
  <title>Medical Body Map — Interactive Anatomical Region Selector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a5 5 0 0 1 5 5v3a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/>
          <path d="M8 14s-4 2-4 6h16c0-4-4-6-4-6"/>
          <line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/>
        </svg>
        <h1>Body Map</h1>
        <span class="badge">Medical</span>
      </div>

          Clear All

          Export
        </button>
      </div>
    </header>

            Front View

          <!-- Zoom Header (shown when a region is zoomed in) -->
          <div id="zoom-header" class="zoom-header hidden">
            <button id="zoom-back" class="btn btn-ghost btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
              Back to Body
            </button>
            <div class="zoom-title-wrap">
              <h3 id="zoom-title">Region</h3>
              <span class="zoom-hint">Tap a highlighted area to select</span>
            </div>
            <button id="zoom-entire" class="btn btn-accent btn-sm">Select Entire Area</button>
          </div>
        </div>

        <!-- Tooltip -->
        <div id="tooltip" class="tooltip"><span id="tooltip-text"></span></div>
      </section>


      <!-- Side Panel -->
      <aside id="side-panel" class="glass-panel">
        <div class="panel-header">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            Selected Regions
          </h2>
          <span id="selection-count" class="count-badge">0</span>
        </div>

        <div id="selected-list" class="selected-list">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            <p>Click on any body region</p>
            <span>Select a region to see minor sub-regions</span>
          </div>
        </div>

        <!-- Severity -->
        <div id="severity-section" class="severity-section hidden">
          <h3>Pain / Severity Level</h3>
          <div class="severity-bar">
            <button class="severity-dot" data-level="1" style="--dot-color:#4ade80" title="Mild">1</button>
            <button class="severity-dot" data-level="2" style="--dot-color:#a3e635" title="Low">2</button>
            <button class="severity-dot" data-level="3" style="--dot-color:#facc15" title="Moderate">3</button>
            <button class="severity-dot" data-level="4" style="--dot-color:#fb923c" title="High">4</button>
            <button class="severity-dot" data-level="5" style="--dot-color:#f87171" title="Severe">5</button>
          </div>
          <p class="severity-label" id="severity-label">Select severity</p>
        </div>

        <!-- Notes -->
        <div id="notes-section" class="notes-section hidden">
          <h3>Notes</h3>
          <textarea id="notes-input" class="notes-input" placeholder="Describe symptoms, pain type, duration..." rows="3"></textarea>
          <button id="btn-save-note" class="btn btn-accent btn-sm">Save Note</button>
        </div>
      </aside>
    </main>

    <!-- Export Modal -->
    <div id="export-modal" class="modal-overlay hidden">
      <div class="modal glass-panel">
        <div class="modal-header">
          <h3>Export Data</h3>
          <button id="modal-close" class="btn-icon">&times;</button>
        </div>
        <pre id="export-json" class="export-json"></pre>
        <div class="modal-actions">
          <button id="btn-copy" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy to Clipboard
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app (2).js"></script>
</body>
</html>
