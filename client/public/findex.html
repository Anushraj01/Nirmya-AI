      </div>
    </header>

          <h3>Pain / Severity Level</h3>
          <div class="severity-bar">
            <button class="severity-dot" data-level="1" style="--dot-color:#4ade80" title="Mild">1</button>
            <button class="severity-dot" data-level="2" style="--dot-color:#a3e635" title="Low">2</button>
            <button class="severity-dot" data-level="3" style="--dot-color:#facc15" title="Moderate">3</button>
            <button class="severity-dot" data-level="4" style="--dot-color:#fb923c" title="High">4</button>
            <button class="severity-dot" data-level="5" style="--dot-color:#f87171" title="Severe">5</button>
          </div>
          <p class="severity-label" id="severity-label">Select severity</p>
        </div>

        <!-- Notes -->
        <div id="notes-section" class="notes-section hidden">
          <h3>Notes</h3>
          <textarea id="notes-input" class="notes-input" placeholder="Describe symptoms, pain type, duration..." rows="3"></textarea>
          <button id="btn-save-note" class="btn btn-accent btn-sm">Save Note</button>
        </div>
      </aside>
    </main>

    <!-- Export Modal -->
    <div id="export-modal" class="modal-overlay hidden">
      <div class="modal glass-panel">
        <div class="modal-header">
          <h3>Export Data</h3>
          <button id="modal-close" class="btn-icon">&times;</button>
        </div>
        <pre id="export-json" class="export-json"></pre>
        <div class="modal-actions">
          <button id="btn-copy" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy to Clipboard
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
